name = "prescript-chat"
main = "chat.js"
compatibility_date = "2026-04-15"

# Deploy: npx wrangler deploy --config workers/chat-wrangler.toml
# Redeploy after editing public/llms.txt: the assistant's facts are bundled from it.

[ai]
binding = "AI"

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

# Message counters (limits are set in chat.js).
[[durable_objects.bindings]]
name = "ATTEMPTS"
class_name = "AttemptCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AttemptCounter"]
