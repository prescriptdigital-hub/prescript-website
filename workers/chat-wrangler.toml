name = "prescript-chat"
main = "chat.js"
compatibility_date = "2026-04-15"

# Deploy: npx wrangler deploy --config workers/chat-wrangler.toml
# Redeploy after editing public/llms.txt: the assistant's facts are bundled from it.

[ai]
binding = "AI"

[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[[ratelimits]]
name = "VISITOR_LIMIT"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "SITE_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
