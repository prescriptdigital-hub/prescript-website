name = "prescript-payment-verify"
main = "verify-payment.js"
compatibility_date = "2024-01-01"

# Direct connection to the tracker. Workers on the same account cannot fetch each other's workers.dev address.
[[services]]
binding = "TRACKER"
service = "prescript-tracker"

# Deploy: npx wrangler deploy --config workers/wrangler.toml
# Add secrets with:
#   wrangler secret put PAYSTACK_SECRET_KEY
#   wrangler secret put FLUTTERWAVE_SECRET_KEY
#   wrangler secret put RESEND_API_KEY
