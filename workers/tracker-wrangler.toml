name = "prescript-tracker"
main = "tracker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "PROJECTS"
id = "2f617639ba0140b0b66a45da8f665d0a"

# Password attempts per visitor per minute, then signed-in admin calls.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMIT"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

# Deploy: wrangler deploy --config workers/tracker-wrangler.toml
# Secrets:
#   wrangler secret put ADMIN_PASSWORD --config workers/tracker-wrangler.toml
#   wrangler secret put INTERNAL_KEY   --config workers/tracker-wrangler.toml
